<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blob -->
  <ellipse cx="900" cy="200" rx="400" ry="350" fill="url(#blob)"/>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo / monogram -->
  <rect x="80" y="80" width="56" height="56" rx="12" fill="#6366f1"/>
  <text x="108" y="120" font-family="system-ui, sans-serif" font-size="28" font-weight="700"
        fill="white" text-anchor="middle">SK</text>

  <!-- Name -->
  <text x="80" y="280" font-family="system-ui, sans-serif" font-size="72" font-weight="800"
        fill="white" letter-spacing="-2">Sumit Kumar</text>

  <!-- Title -->
  <text x="80" y="345" font-family="system-ui, sans-serif" font-size="32" font-weight="500"
        fill="#818cf8">Lead Software Engineer</text>

  <!-- Divider -->
  <rect x="80" y="375" width="80" height="3" rx="2" fill="#6366f1"/>

  <!-- Tagline -->
  <text x="80" y="430" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">
    Building user-focused, high-impact software
  </text>
  <text x="80" y="460" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">
    React · FastAPI · Python · AWS · GCP
  </text>

  <!-- URL -->
  <text x="80" y="550" font-family="system-ui, monospace" font-size="18" fill="#475569">
    personal-portfolio-pink-alpha-31.vercel.app
  </text>
